name: 功能建议
description: 提出新玩法、操作改进或界面建议。
title: "[建议] "
body:
  - type: textarea
    id: suggestion
    attributes:
      label: 希望改进什么？
      description: 请说明你在哪个场景遇到了什么不便，以及希望游戏怎样表现。
      placeholder: 例如，在选援助时，我希望能……，这样就能……
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 参考资料（可选）
      description: 如果是还原原版的建议，可以附上原版的角色、招式、操作步骤、截图或视频时间点。
