<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Keep the engine's logical canvas while scaling its presentation proportionally. */
body {
    overflow: auto; touch-action: auto; font: 14px system-ui, sans-serif;
    background: #100d0e; color: #f5efea;
    background-image: linear-gradient(125deg, #9e15152b, transparent 45%),
        repeating-linear-gradient(135deg, transparent 0 80px, #ffffff03 80px 81px);
}
#player { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
#toolbar {
    box-sizing: border-box; width: min(1200px, 94vw); padding: 26px 0 18px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid #6b3434;
}
#toolbar strong { margin-right: auto; font-size: clamp(20px, 3vw, 30px); font-style: italic; letter-spacing: -1px; }
#toolbar strong span { color: #ed4339; font-size: .75em; margin: 0 5px; }
#toolbar strong small { display: block; margin-top: 5px; font: 10px system-ui, sans-serif; letter-spacing: 4px; color: #a99a94; }
#online-controls[hidden], #online-controls [hidden] { display: none !important; }
#online-controls {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    min-width: 0; max-width: 100%; color: #e9d8d0; font-size: 11px;
}
#online-status { max-width: min(30vw, 340px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
#online-request { color: #f2c3b0; font-weight: 700; }
#online-controls button {
    padding: 6px 10px; border-color: #80514b; background: #26191a;
    font-size: 11px; transform: none;
}
#online-controls button:hover { background: #49302c; }
#online-controls #online-exit { border-color: #ad3b35; }
#online-controls #online-collapse-tools { margin-left: 2px; }
button {
    padding: 11px 22px; border: 1px solid #71504b; border-radius: 2px;
    color: #f5efea; background: #211a1a; cursor: pointer; font: 600 13px system-ui, sans-serif;
    transform: skew(-8deg); transition: background .15s, border-color .15s;
}
#fullscreen { background: #ad241f; border-color: #e84a3f; }
button:hover { background: #49302c; border-color: #f5b095; }
#fullscreen:hover { background: #cf3028; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
button:disabled { opacity: .5; cursor: default; }
#help { margin: 15px 20px; color: #b8a9a2; font-size: 12px; text-align: center; letter-spacing: 1px; }
#viewport {
    position: relative; width: min(1200px, 94vw, calc((100dvh - 190px) * 1.5));
    aspect-ratio: 3 / 2; background: black; flex: none;
    box-shadow: 0 0 0 1px #76534a, 0 16px 60px #0009;
}
#canvas { position: absolute; inset: 0; }
#feedback { min-height: 1.5em; margin: 14px 20px; color: #d0b6a5; font-size: 12px; text-align: center; }
#player:fullscreen {
    background: black; overflow: hidden; width: 100%; height: 100%;
    min-height: 0; justify-content: center;
}
#player:fullscreen #viewport {
    width: min(100vw, 150dvh); height: min(100dvh, calc(100vw / 1.5));
    box-shadow: none;
}
#player:fullscreen #help, #player:fullscreen #toolbar strong { display: none; }
#player:fullscreen #toolbar {
    position: absolute; top: 12px; right: 14px; z-index: 6; width: auto;
    box-sizing: border-box; max-width: calc(100vw - 28px); padding: 8px; border: 0; border-bottom: 1px solid #6b3434;
    border-radius: 0 0 3px 3px; background: #151112e8; flex-wrap: wrap; justify-content: flex-end;
    opacity: 0; transform: translateY(calc(-100% - 14px)); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
}
#player:fullscreen:not(.tools-collapsed) #toolbar:hover,
#player:fullscreen:not(.tools-collapsed) #toolbar.keyboard-focus:focus-within,
#player:fullscreen.tools-visible #toolbar {
    opacity: 1; transform: translateY(0); pointer-events: auto;
}
#player:fullscreen.tools-collapsed #toolbar { opacity: 0; transform: translateY(calc(-100% - 14px)); pointer-events: none; }
#edge-indicator { display: none; }
#player:fullscreen #edge-indicator {
    display: block; position: absolute; z-index: 7; top: 0; right: 14px;
    box-sizing: border-box; width: 132px; height: 24px; padding: 0; border: 0; border-radius: 0 0 10px 10px;
    background: transparent; opacity: .92; cursor: pointer;
    transform: none; transition: opacity .18s ease, background .18s ease;
}
#player:fullscreen #edge-indicator:hover { background: transparent; }
#player:fullscreen #edge-indicator:hover,
#player:fullscreen.tools-visible #edge-indicator:hover { opacity: 1; }
#player:fullscreen.tools-visible #edge-indicator { opacity: .22; }
#edge-indicator > span:first-child {
    position: relative; display: block; box-sizing: border-box; width: 64px; height: 18px; margin: 3px auto 0;
    border: 1px solid #c5aaa28c; border-top-color: #ad3d35b8; border-radius: 2px 2px 9px 9px;
    background: #21191ae8; box-shadow: 0 2px 6px #000c, inset 0 1px #ffffff12;
    backdrop-filter: blur(5px); transition: background .18s ease, border-color .18s ease;
}
#edge-indicator > span:first-child::before {
    content: ""; position: absolute; left: 28px; top: 3px; width: 7px; height: 7px;
    border: solid #f0e4de; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
#edge-indicator > span:first-child::after {
    content: ""; position: absolute; left: 9px; top: 7px; width: 3px; height: 3px;
    border-radius: 50%; background: #d14a3e; box-shadow: 0 0 3px #d14a3e88;
}
#edge-indicator:hover > span:first-child { background: #302224f2; border-color: #e0c8bdc9; border-top-color: #ef5146; }
#edge-indicator span.edge-label {
    position: absolute; top: 20px; right: 0; display: none; width: max-content; height: auto; max-width: min(240px, calc(100vw - 24px)); margin: 0;
    padding: 5px 9px; border: 1px solid #8d443b; border-radius: 2px; background: #21191af2;
    color: #f5d4c6; box-shadow: 0 2px 8px #000b; font: 600 11px/1.25 system-ui, sans-serif; text-align: right;
}
#edge-indicator.online-active .edge-label { display: block; }
#edge-indicator.online-request .edge-label { border-color: #e34238; color: #fff; }
#player:fullscreen.tools-visible:not(.tools-collapsed) #edge-indicator.online-active { opacity: .85; }
#online-controls #online-collapse-tools { display: none; }
#player:fullscreen #online-controls #online-collapse-tools { display: inline-block; }
#audio-control { position: relative; }
#audio-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-width: 44px; padding: 10px 13px; background: #211a1a;
    transform: none; transition: background .15s, border-color .15s;
}
#audio-toggle svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
#audio-toggle .speaker-waves { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
#audio-control[data-muted="true"] #audio-toggle { color: #d9aaa0; }
.speaker-cross { display: none; fill: none !important; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
#audio-control[data-muted="true"] .speaker-waves,
#audio-control[data-muted="true"] #mute-toggle .speaker-waves { display: none; }
#audio-control[data-muted="true"] .speaker-cross { display: block; }
#volume-panel {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 8;
    box-sizing: border-box; width: 256px; padding: 15px 16px 12px;
    color: #f5efea; background: #181314f5; border: 1px solid #76534a;
    border-top: 2px solid #ad241f; box-shadow: 0 12px 36px #000b;
    transform: skew(0); backdrop-filter: blur(14px);
}
#volume-panel[hidden] { display: none; }
.volume-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; }
#mute-toggle {
    display: grid; place-items: center; width: 34px; height: 32px; padding: 6px;
    border-color: #71504b; transform: none;
}
#mute-toggle svg { width: 17px; height: 17px; fill: currentColor; }
.volume-slider-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.volume-slider-row svg { width: 16px; height: 16px; fill: #cdb9b1; flex: none; }
#volume-slider { width: 100%; min-width: 0; accent-color: #e34238; cursor: pointer; touch-action: pan-y; }
#volume-value { min-width: 34px; color: #f2c3b0; text-align: right; font-variant-numeric: tabular-nums; }
#volume-status { min-height: 1.2em; margin-top: 9px; color: #aa9993; font-size: 10px; }
#audio-control:focus-within #volume-panel { outline: none; }
#toolbar button { flex: none; }
#player:fullscreen #feedback {
    position: absolute; bottom: 28px; z-index: 5; margin: 0 20px; min-height: 0;
    padding: 12px 20px; background: #100d0ee8; border-left: 3px solid #df392e;
    color: #fff; pointer-events: none; opacity: 0;
}
#player:fullscreen.tools-visible #feedback { opacity: 1; }
@media (max-width: 600px) {
    #toolbar { padding-top: 14px; }
    button { padding: 9px 12px; }
    #toolbar strong small { letter-spacing: 2px; }
    #volume-panel { width: min(256px, calc(100vw - 24px)); }
    #online-controls { flex: 1 1 100%; }
    #online-status { max-width: 100%; flex: 1 1 100%; }
    #player:fullscreen #online-controls { flex: 1 1 100%; }
    #player:fullscreen #online-status { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    button, #player:fullscreen #toolbar, #player:fullscreen #edge-indicator,
    #player:fullscreen #feedback { transition: none; }
}
        </style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
        <main id="player">
        <nav id="toolbar" aria-label="游戏工具">
            <strong>死神 <span>VS</span> 火影 <span>2.6</span><small>BLEACH VS NARUTO</small></strong>
            <section id="online-controls" aria-label="联机对战控制" hidden>
                <span id="online-status" role="status" aria-live="polite"></span>
                <span id="online-request" hidden></span>
                <button id="online-pause" type="button" hidden></button>
                <button id="online-accept-pause" type="button" hidden>同意</button>
                <button id="online-refuse-pause" type="button" hidden>拒绝</button>
                <button id="online-skip-intro" type="button" hidden>请求跳过开场</button>
                <button id="online-exit" type="button" hidden></button>
                <button id="online-collapse-tools" type="button" aria-label="收起游戏工具" title="收起">收起</button>
            </section>
            <div id="audio-control" data-muted="false">
                <button id="audio-toggle" type="button" aria-label="音量设置" aria-expanded="false" aria-controls="volume-panel" title="音量设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m2-9a7 7 0 0 1 0 12"></path><path class="speaker-cross" d="m16 10 5 5m0-5-5 5"></path></svg>
                </button>
                <section id="volume-panel" aria-label="音量控制" hidden>
                    <div class="volume-heading">
                        <span>主音量</span>
                        <button id="mute-toggle" type="button" aria-label="静音" title="静音">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m2-9a7 7 0 0 1 0 12"></path><path class="speaker-cross" d="m16 10 5 5m0-5-5 5"></path></svg>
                        </button>
                    </div>
                    <div class="volume-slider-row">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path></svg>
                        <input id="volume-slider" type="range" min="0" max="100" step="1" value="72" aria-label="主音量">
                        <output id="volume-value" for="volume-slider">72%</output>
                    </div>
                    <div id="volume-status" role="status" aria-live="polite">等待游戏音频初始化</div>
                </section>
            </div>
            <button id="fullscreen" type="button">进入全屏</button>
            <button id="download" type="button">导出日志</button>
        </nav>
        <button id="edge-indicator" type="button" aria-label="显示游戏工具"><span aria-hidden="true"></span><span class="edge-label" hidden></span></button>
        <p id="help">点击画面，开始对战 · 全屏沉浸游玩 · 遇到问题可导出日志反馈</p>
        <div id="viewport">
        <canvas id="canvas" tabindex="0">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

        </div>
        <p id="feedback" role="status" aria-live="polite"></p>
        </main>
        <script>
(() => {
    const player = document.getElementById('player');
    const canvas = document.getElementById('canvas');
    const fullscreen = document.getElementById('fullscreen');
    const feedback = document.getElementById('feedback');
    const edgeIndicator = document.getElementById('edge-indicator');
    const toolbar = document.getElementById('toolbar');
    const onlineControls = document.getElementById('online-controls');
    const onlineStatus = document.getElementById('online-status');
    const onlineRequest = document.getElementById('online-request');
    const onlinePause = document.getElementById('online-pause');
    const onlineAcceptPause = document.getElementById('online-accept-pause');
    const onlineRefusePause = document.getElementById('online-refuse-pause');
    const onlineSkipIntro = document.getElementById('online-skip-intro');
    const onlineExit = document.getElementById('online-exit');
    const onlineCollapseTools = document.getElementById('online-collapse-tools');
    const edgeLabel = edgeIndicator.querySelector('.edge-label');
    const audioControl = document.getElementById('audio-control');
    const audioToggle = document.getElementById('audio-toggle');
    const muteToggle = document.getElementById('mute-toggle');
    const volumePanel = document.getElementById('volume-panel');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeValue = document.getElementById('volume-value');
    const volumeStatus = document.getElementById('volume-status');
    let toolsTimer;
    let toolsHovered = false;
    let edgeHovered = false;
    let sliderDragging = false;
    let touchPinned = false;
    let edgePointerType = 'mouse';
    let onlineOwnerToken = 0;
    let nextOnlineOwnerToken = 1;
    let onlineControlsCallback = null;
    let onlineControlsSnapshot = null;
    let onlineControlsSerialized = '';
    const seenOnlineSessions = new Set();
    const AUDIO_KEY = 'bvn26.audio.v1';
    const DEFAULT_VOLUME = 72;
    function validOnlineControlsSnapshot(value) {
        if (!value || typeof value !== 'object' || Array.isArray(value) || value.schemaVersion !== 1
                || typeof value.active !== 'boolean' || typeof value.session !== 'string' || value.session.length > 128
                || !Number.isSafeInteger(value.revision) || value.revision < 0
                || typeof value.status !== 'string' || value.status.length > 500
                || typeof value.pauseLabel !== 'string' || value.pauseLabel.length > 80
                || typeof value.canPause !== 'boolean' || typeof value.canResume !== 'boolean'
                || typeof value.canAcceptPause !== 'boolean' || typeof value.canRefusePause !== 'boolean'
                || typeof value.canSkipIntro !== 'boolean' || typeof value.canExit !== 'boolean'
                || typeof value.exitLabel !== 'string' || value.exitLabel.length > 80) return false;
        if (value.active && value.session.length === 0) return false;
        if (value.pauseRequest !== null) {
            const request = value.pauseRequest;
            if (!request || typeof request !== 'object' || Array.isArray(request)
                    || typeof request.id !== 'string' || request.id.length === 0 || request.id.length > 128
                    || typeof request.text !== 'string' || request.text.length > 240) return false;
        }
        return true;
    }
    function canonicalOnlineControlsSnapshot(value) {
        return JSON.stringify({
            schemaVersion: value.schemaVersion,
            active: value.active,
            session: value.session,
            revision: value.revision,
            status: value.status,
            pauseLabel: value.pauseLabel,
            canPause: value.canPause,
            canResume: value.canResume,
            pauseRequest: value.pauseRequest === null ? null : { id: value.pauseRequest.id, text: value.pauseRequest.text },
            canAcceptPause: value.canAcceptPause,
            canRefusePause: value.canRefusePause,
            canSkipIntro: value.canSkipIntro,
            canExit: value.canExit,
            exitLabel: value.exitLabel,
        });
    }
    function currentOnlineAction(action) {
        const state = onlineControlsSnapshot;
        if (!state || !state.active) return false;
        switch (action) {
            case 'pause': return state.canPause;
            case 'resume': return state.canResume;
            case 'accept_pause': return state.pauseRequest !== null && state.canAcceptPause;
            case 'refuse_pause': return state.pauseRequest !== null && state.canRefusePause;
            case 'skip_intro': return state.canSkipIntro;
            case 'exit': return state.canExit;
            default: return false;
        }
    }
    function preserveOnlineToolbarForUserAction() {
        const state = onlineControlsSnapshot;
        return Boolean(state?.active && (state.pauseRequest !== null
            || (state.canExit && state.exitLabel !== '退出本局')));
    }
    function sendOnlineAction(action) {
        const state = onlineControlsSnapshot;
        if (!currentOnlineAction(action) || typeof onlineControlsCallback !== 'function') return false;
        const requestId = action === 'accept_pause' || action === 'refuse_pause' ? state.pauseRequest.id : '';
        try {
            onlineControlsCallback(action, state.session, state.revision, requestId);
            canvas.focus();
            return true;
        } catch (error) {
            record('warn', 'Online control callback failed', error);
            canvas.focus();
            return false;
        }
    }
    function renderOnlineControls(state) {
        const active = state.active;
        onlineControls.hidden = !active;
        edgeIndicator.classList.toggle('online-active', active);
        edgeIndicator.classList.toggle('online-request', active && state.pauseRequest !== null);
        edgeLabel.hidden = !active;
        edgeLabel.textContent = state.pauseRequest === null ? '联机' : '对方有操作请求';
        edgeIndicator.setAttribute('aria-label', !active ? '显示游戏工具'
            : state.pauseRequest === null ? '显示联机控制' : '对方请求了联机操作，显示控制');
        onlineStatus.hidden = !active || state.status.length === 0;
        onlineStatus.textContent = state.status;
        onlineStatus.title = state.status;
        onlineRequest.hidden = !active || state.pauseRequest === null || state.pauseRequest.text === state.status;
        onlineRequest.textContent = state.pauseRequest === null ? '' : state.pauseRequest.text;
        onlinePause.hidden = !active || !(state.canPause || state.canResume);
        onlinePause.disabled = !(state.canPause || state.canResume);
        onlinePause.textContent = state.pauseLabel;
        onlineAcceptPause.hidden = !active || state.pauseRequest === null || !state.canAcceptPause;
        onlineAcceptPause.disabled = onlineAcceptPause.hidden;
        onlineRefusePause.hidden = !active || state.pauseRequest === null || !state.canRefusePause;
        onlineRefusePause.disabled = onlineRefusePause.hidden;
        onlineSkipIntro.hidden = !active || !state.canSkipIntro;
        onlineSkipIntro.disabled = onlineSkipIntro.hidden;
        onlineExit.hidden = !active || !state.canExit;
        onlineExit.disabled = onlineExit.hidden;
        onlineExit.textContent = state.exitLabel;
        if (!active) {
            onlineRequest.textContent = '';
            if (isFullscreen()) scheduleHideTools(0);
        } else if (isFullscreen() && preserveOnlineToolbarForUserAction()
                && player.classList.contains('tools-visible') && !player.classList.contains('tools-collapsed')) {
            clearTimeout(toolsTimer);
        }
    }
    function emptyOnlineControlsSnapshot() {
        return {
            schemaVersion: 1, active: false, session: '', revision: 0, status: '', pauseLabel: '',
            canPause: false, canResume: false, pauseRequest: null, canAcceptPause: false,
            canRefusePause: false, canSkipIntro: false, canExit: false, exitLabel: '',
        };
    }
    window.bvnOnlineControlsRegister = callback => {
        if (typeof callback !== 'function') return 0;
        const token = nextOnlineOwnerToken++;
        if (!Number.isSafeInteger(token) || token <= 0) return 0;
        onlineOwnerToken = token;
        onlineControlsCallback = callback;
        onlineControlsSnapshot = null;
        onlineControlsSerialized = '';
        seenOnlineSessions.clear();
        renderOnlineControls(emptyOnlineControlsSnapshot());
        return token;
    };
    window.bvnOnlineControlsUnregister = token => {
        if (!Number.isSafeInteger(token) || token <= 0 || onlineControlsCallback === null || token !== onlineOwnerToken) return false;
        onlineOwnerToken = 0;
        onlineControlsCallback = null;
        onlineControlsSnapshot = null;
        onlineControlsSerialized = '';
        seenOnlineSessions.clear();
        renderOnlineControls(emptyOnlineControlsSnapshot());
        return true;
    };
    window.bvnOnlineControlsUpdate = (serialized, token) => {
        if (!Number.isSafeInteger(token) || token <= 0 || onlineControlsCallback === null
                || token !== onlineOwnerToken || typeof serialized !== 'string' || serialized.length > 8192) return false;
        let snapshot;
        try { snapshot = JSON.parse(serialized); }
        catch (_) { return false; }
        if (!validOnlineControlsSnapshot(snapshot)) return false;
        const canonicalSnapshot = canonicalOnlineControlsSnapshot(snapshot);
        const current = onlineControlsSnapshot;
        if (current && snapshot.session === current.session) {
            if (snapshot.revision < current.revision) return false;
            if (snapshot.revision === current.revision && canonicalSnapshot !== onlineControlsSerialized) return false;
        } else if (current && snapshot.session !== current.session && seenOnlineSessions.has(snapshot.session)) {
            return false;
        }
        if (snapshot.active) {
            seenOnlineSessions.add(snapshot.session);
            while (seenOnlineSessions.size > 32) seenOnlineSessions.delete(seenOnlineSessions.values().next().value);
        }
        onlineControlsSnapshot = snapshot;
        onlineControlsSerialized = canonicalSnapshot;
        renderOnlineControls(snapshot);
        return true;
    };

            role: 'unclassified',
            peer,
            createdAt: new Date().toISOString(),
            createdMonoMs: Math.max(0, performance.now()),
            connectionState: 'unknown',
            iceConnectionState: 'unknown',
            stateHistory: [],
            stateListeners: [],
            endedAt: null,
            endedMonoMs: null,
            endedReason: null,
            samplePending: false,
            sampleCount: 0,
            droppedSamples: 0,
            statsErrorCount: 0,
            lastSampleStatus: 'pending',
            samples: [],
        };
        rtcConnections.push(connection);
        recordRtcState(connection);
        if (connection.peer && peer && typeof peer.addEventListener === 'function') {
            for (const name of ['connectionstatechange', 'iceconnectionstatechange']) {
                const callback = () => recordRtcState(connection);
                try {
                    peer.addEventListener(name, callback);
                    connection.stateListeners.push({ name, callback });
                } catch (_) {}
            }
        }
        if (connection.peer && rtcSampleTimer === null) {
            rtcSampleTimer = setInterval(sampleRtcConnections, rtcSampleIntervalMs);
        }
    }

    function installRtcDiagnosticsHook() {
        const nativeConstructor = window.RTCPeerConnection;
        if (typeof nativeConstructor !== 'function') {
            rtcConstructorHookStatus = 'native_constructor_unavailable';
            return;
        }
        try {
            let diagnosticConstructor;
            diagnosticConstructor = new Proxy(nativeConstructor, {
                construct(target, args, newTarget) {
                    const peer = Reflect.construct(target, args,
                        newTarget === diagnosticConstructor ? target : newTarget);
                    try { trackRtcConnection(peer); } catch (_) {}
                    return peer;
                },
            });
            window.RTCPeerConnection = diagnosticConstructor;
            rtcConstructorHookStatus = window.RTCPeerConnection === diagnosticConstructor
                ? 'active' : 'constructor_not_writable';
        } catch (_) {
            rtcConstructorHookStatus = 'constructor_not_writable';
        }
    }

    installRtcDiagnosticsHook();
    window.addEventListener('pagehide', () => {
        if (rtcSampleTimer !== null) clearInterval(rtcSampleTimer);
        rtcSampleTimer = null;
        const endedAt = new Date().toISOString();
        const endedMonoMs = Math.max(0, performance.now());
        for (const connection of rtcConnections) {
            releaseRtcPeer(connection, 'pagehide', endedAt, endedMonoMs);
        }
    });

    window.bvnDiagnosticsGetContext = () => JSON.stringify({
        schemaVersion: 2,
        runId: sessionId,
        buildSidecar,
        buildSidecarStatus,
    });
    window.bvnDiagnosticsPush = serialized => {
        if (typeof serialized !== 'string' || serialized.length > runtimeEventLimitBytes) {
            rejectedRuntimeEvents++;
            return false;
        }
        try {
            return appendRuntimeEvent(JSON.parse(serialized));
        } catch (_) {
            rejectedRuntimeEvents++;
            return false;
        }
    };
    window.bvnDiagnosticsSetSnapshot = serialized => {
        if (typeof serialized !== 'string' || serialized.length > runtimeEventLimitBytes) {
            rejectedRuntimeEvents++;
            return false;
        }
        try {
            const snapshot = JSON.parse(serialized);
            if (!snapshot || typeof snapshot !== 'object' || Array.isArray(snapshot)) {
                rejectedRuntimeEvents++;
                return false;
            }
            latestRuntimeSnapshot = snapshot;
            if (typeof snapshot.buildID === 'string') runtimeBuildId = snapshot.buildID;
            const waiter = snapshotWaiters.get(snapshot.requestId);
            if (waiter) {
                clearTimeout(waiter.timeout);
                snapshotWaiters.delete(snapshot.requestId);
                waiter.resolve({ status: 'acknowledged', snapshot });
            }
            return true;
        } catch (_) {
            rejectedRuntimeEvents++;
            return false;
        }
    };
    window.bvnDiagnosticsRegister = callback => {
        diagnosticsRequestCallback = typeof callback === 'function' ? callback : null;
        if (diagnosticsRequestCallback) diagnosticsRequestCallback('visibility', document.visibilityState);
    };
    window.bvnDiagnosticsUnregister = callback => {
        if (!callback || callback === diagnosticsRequestCallback) diagnosticsRequestCallback = null;
    };

    function requestRuntimeSnapshot() {
        if (!diagnosticsRequestCallback) return Promise.resolve({ status: 'runtime_unavailable', snapshot: latestRuntimeSnapshot });
        const requestId = makeRunReportId('snapshot');
        return new Promise(resolve => {
            const timeout = setTimeout(() => {
                snapshotWaiters.delete(requestId);
                resolve({ status: 'timeout', snapshot: latestRuntimeSnapshot });
            }, 1000);
            snapshotWaiters.set(requestId, { resolve, timeout });
            try {
                diagnosticsRequestCallback('snapshot', requestId);
            } catch (error) {
                clearTimeout(timeout);
                snapshotWaiters.delete(requestId);
                resolve({ status: 'request_error', error: format(error), snapshot: latestRuntimeSnapshot });
            }
        });
    }

    for (const level of ['log', 'info', 'warn', 'error']) {
        const original = console[level].bind(console);
        console[level] = (...args) => { record(level, ...args); original(...args); };
    }
    window.addEventListener('error', event => record('error', event.error || event.message || 'Resource failed: ' + event.target?.src), true);
    window.addEventListener('unhandledrejection', event => record('error', event.reason));
    document.addEventListener('visibilitychange', () => {
        record('lifecycle', document.visibilityState);
        appendShellEvent('page_visibility', { state: document.visibilityState });
        if (diagnosticsRequestCallback) diagnosticsRequestCallback('visibility', document.visibilityState);
    });
    canvas.addEventListener('webglcontextlost', () => record('error', 'WebGL context lost'));
    const viewport = document.getElementById('viewport');
    function fitCanvasToViewport() {
        const rect = viewport.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        window.bvnCanvasSize = {
            viewport: { width: rect.width, height: rect.height },
            canvas: { width: canvas.width, height: canvas.height },
            devicePixelRatio: dpr,
        };
        record('canvasresize', window.bvnCanvasSize);
    }
    const viewportObserver = new ResizeObserver(fitCanvasToViewport);
    viewportObserver.observe(viewport);
    window.addEventListener('resize', fitCanvasToViewport);
    document.addEventListener('fullscreenchange', fitCanvasToViewport);
    fitCanvasToViewport();
    record('session', 'Web player started');
    const available = document.fullscreenEnabled && player.requestFullscreen;
    fullscreen.disabled = !available;
    if (!available) fullscreen.textContent = '浏览器不支持全屏';
    fullscreen.addEventListener('click', async () => {
        try {
            if (document.fullscreenElement) await document.exitFullscreen();
            else await player.requestFullscreen();
            canvas.focus();
        } catch (error) {
            record('error', error);
            feedback.textContent = '全屏切换失败，可继续窗口游玩。' + error.message;
        }
    });
    document.addEventListener('fullscreenchange', () => {
        const active = isFullscreen();
        fullscreen.textContent = active ? '退出全屏' : '进入全屏';
        setPanelOpen(false);
        toolsHovered = false;
        touchPinned = false;
        player.classList.remove('tools-visible', 'tools-collapsed');
        clearTimeout(toolsTimer);
        record('fullscreen', active);
    });
    document.getElementById('download').addEventListener('click', async () => {
        record('session', 'Log exported');
        const snapshotResult = await requestRuntimeSnapshot();
        await buildSidecarPromise;
        const nowMonoMs = performance.now();
        trimRuntimeEvents(nowMonoMs);
        const retainedItems = runtimeEvents.slice(runtimeEventHead, runtimeEventHead + runtimeEventCount);
        const retainedEvents = retainedItems.map(item => item.event);
        const firstEvent = retainedItems[0] || null;
        for (let index = activeIncidents.length - 1; index >= 0; index--) {
            if (nowMonoMs > activeIncidents[index].endsMonoMs) {
                activeIncidents[index].status = 'window_complete';
                activeIncidents.splice(index, 1);
            }
        }
        const snapshot = snapshotResult.snapshot;
        const snapshotBuildId = snapshot && typeof snapshot.buildID === 'string' ? snapshot.buildID : runtimeBuildId;
        const sidecarBuildId = buildSidecar && buildSidecar.buildID;
        const buildStatus = buildSidecarStatus !== 'ready' || !snapshotBuildId
            ? 'unknown'
            : snapshotBuildId === sidecarBuildId ? 'match' : 'mismatch';
        const report = {
            schemaVersion: 2, startedAt, exportedAt: new Date().toISOString(), runId: sessionId,
            page: location.origin + location.pathname,
            userAgent: navigator.userAgent, language: navigator.language,
            viewport: { width: innerWidth, height: innerHeight, devicePixelRatio },
            canvas: { width: canvas.width, height: canvas.height },
            fullscreen: Boolean(document.fullscreenElement),
            droppedEntries: dropped, messageLimit: legacyMessageLimit, entries: entries.map(item => item.value),
            build: {
                status: buildStatus,
                buildID: snapshotBuildId || null,
                sidecarBuildID: sidecarBuildId || null,
                gitCommit: buildSidecar?.gitCommit || null,
                dirty: typeof buildSidecar?.dirty === 'boolean' ? buildSidecar.dirty : null,
                dirtyPaths: buildSidecar?.dirtyPaths || [],
                resourceVersion: buildSidecar?.resourceVersion || snapshot?.resourceVersion || null,
                pckSha256: buildSidecar?.pckSha256 || null,
                pckHashKind: buildSidecar?.pckHashKind || null,
                builtAt: buildSidecar?.builtAt || null,
                exportedAt: buildSidecar?.exportedAt || null,
            },
            runtime: {
                snapshotStatus: snapshotResult.status,
                snapshotError: snapshotResult.error || null,
                snapshot: snapshot || null,
                events: retainedEvents,
                criticalEvents: criticalEvents.slice(),
                criticalIncidents: criticalIncidents.map(incident => ({
                    trigger: incident.trigger,
                    status: incident.status,
                    windowMs: { before: incidentWindowBeforeMs, after: incidentWindowAfterMs },
                    events: incident.events,
                    droppedEvents: incident.droppedEvents,
                })),
                inputTape: retainedEvents.filter(event => event.type === 'input_consumed'),
                buffer: {
                    windowMs: logWindowMs,
                    coverageMs: firstEvent ? Math.max(0, Math.min(logWindowMs, nowMonoMs - firstEvent.receivedMonoMs)) : 0,
                    startAt: firstEvent?.event.receivedAt || null,
                    endAt: retainedItems.length ? retainedItems[retainedItems.length - 1].event.receivedAt : null,
                    retainedEvents: retainedEvents.length,
                    retainedBytes: runtimeEventBytes,
                    byteLimit: runtimeByteLimit,
                    eventLimit: runtimeEventLimit,
                    criticalEventLimit,
                    criticalDropped,
                    incidentLimit,
                    incidentDropped,
                    rejectedEvents: rejectedRuntimeEvents,
                    dropped: { ...runtimeDropped },
                },
            },
            webrtc: rtcSnapshot(),
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'bvn26-log-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        feedback.textContent = snapshotResult.status === 'acknowledged'
            ? '日志已导出，请在反馈问题时附上文件和复现步骤。日志仅保存在本地，刷新后重新记录。'
            : '日志已导出，但游戏状态回执未完成；文件中会标明这一点。';
        revealTools();
        canvas.focus();
    });
})();
        </script>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine({
    ...GODOT_CONFIG,
    onPrint: (...args) => console.log(...args),
    onPrintError: (...args) => console.error(...args),
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
