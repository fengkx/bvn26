<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<script defer data-domain="bvn26.vercel.app" src="https://tt.fengkx.top/js/script.js"></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 55%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Keep the engine's logical canvas while scaling its presentation proportionally. */
body {
    overflow: auto; touch-action: auto; font: 14px system-ui, sans-serif;
    background: #100d0e; color: #f5efea;
    background-image: linear-gradient(125deg, #9e15152b, transparent 45%),
        repeating-linear-gradient(135deg, transparent 0 80px, #ffffff03 80px 81px);
}
#player { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
#toolbar {
    box-sizing: border-box; width: min(1200px, 94vw); padding: 26px 0 18px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid #6b3434;
}
#brand { display: flex; align-items: center; gap: 20px; margin-right: auto; }
#repository {
    display: inline-flex; align-items: center; gap: 5px; min-height: 36px;
    padding: 0 4px; color: #ccb9b0; font: 600 13px system-ui, sans-serif; text-decoration: none;
}
#repository svg { width: 13px; height: 13px; color: #ed7168; }
#repository:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
#repository:focus-visible { outline: 2px solid #f5b095; outline-offset: 2px; border-radius: 2px; }
#toolbar strong { font-size: clamp(20px, 3vw, 30px); font-style: italic; letter-spacing: -1px; }
#toolbar strong span { color: #ed4339; font-size: .75em; margin: 0 5px; }
#toolbar strong small { display: block; margin-top: 5px; font: 10px system-ui, sans-serif; letter-spacing: 4px; color: #a99a94; }
#online-controls[hidden], #online-controls [hidden] { display: none !important; }
#online-controls {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    min-width: 0; max-width: 100%; color: #e9d8d0; font-size: 11px;
}
#online-status { max-width: min(30vw, 340px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
#online-request { color: #f2c3b0; font-weight: 700; }
#online-controls button {
    padding: 6px 10px; border-color: #80514b; background: #26191a;
    font-size: 11px; transform: none;
}
#online-controls button:hover { background: #49302c; }
#online-controls #online-exit { border-color: #ad3b35; }
#online-controls #online-collapse-tools { margin-left: 2px; }
button {
    padding: 11px 22px; border: 1px solid #71504b; border-radius: 2px;
    color: #f5efea; background: #211a1a; cursor: pointer; font: 600 13px system-ui, sans-serif;
    transform: skew(-8deg); transition: background .15s, border-color .15s;
}
#fullscreen { background: #ad241f; border-color: #e84a3f; }
button:hover { background: #49302c; border-color: #f5b095; }
#fullscreen:hover { background: #cf3028; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
button:disabled { opacity: .5; cursor: default; }
#help { margin: 15px 20px; color: #b8a9a2; font-size: 12px; text-align: center; letter-spacing: 1px; }
#viewport {
    position: relative; width: min(1200px, 94vw, calc((100dvh - 190px) * 1.5));
    aspect-ratio: 3 / 2; background: black; flex: none;
    box-shadow: 0 0 0 1px #76534a, 0 16px 60px #0009;
}
#canvas { position: absolute; inset: 0; }
#feedback { min-height: 1.5em; margin: 14px 20px; color: #d0b6a5; font-size: 12px; text-align: center; }
#player:is(:fullscreen, .touch-fullscreen) {
    background: black; overflow: hidden; width: 100%; height: 100%;
    min-height: 0; justify-content: center;
}
#player:is(:fullscreen, .touch-fullscreen) #viewport {
    width: min(100vw, 150dvh); height: min(100dvh, calc(100vw / 1.5));
    box-shadow: none;
}
#player:is(:fullscreen, .touch-fullscreen) #help, #player:is(:fullscreen, .touch-fullscreen) #brand { display: none; }
#player:is(:fullscreen, .touch-fullscreen) #toolbar {
    position: absolute; top: 12px; right: 14px; z-index: 6; width: auto;
    box-sizing: border-box; max-width: calc(100vw - 28px); padding: 8px; border: 0; border-bottom: 1px solid #6b3434;
    border-radius: 0 0 3px 3px; background: #151112e8; flex-wrap: wrap; justify-content: flex-end;
    opacity: 0; transform: translateY(calc(-100% - 14px)); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
}
#player:is(:fullscreen, .touch-fullscreen):not(.tools-collapsed) #toolbar:hover,
#player:is(:fullscreen, .touch-fullscreen):not(.tools-collapsed) #toolbar.keyboard-focus:focus-within,
#player:is(:fullscreen, .touch-fullscreen).tools-visible #toolbar {
    opacity: 1; transform: translateY(0); pointer-events: auto;
}
#player:is(:fullscreen, .touch-fullscreen).tools-collapsed #toolbar { opacity: 0; transform: translateY(calc(-100% - 14px)); pointer-events: none; }
#edge-indicator { display: none; }
#player:is(:fullscreen, .touch-fullscreen) #edge-indicator {
    display: block; position: absolute; z-index: 7; top: 0; right: 14px;
    box-sizing: border-box; width: 132px; height: 24px; padding: 0; border: 0; border-radius: 0 0 10px 10px;
    background: transparent; opacity: .92; cursor: pointer;
    transform: none; transition: opacity .18s ease, background .18s ease;
}
#player:is(:fullscreen, .touch-fullscreen) #edge-indicator:hover { background: transparent; }
#player:is(:fullscreen, .touch-fullscreen) #edge-indicator:hover,
#player:is(:fullscreen, .touch-fullscreen).tools-visible #edge-indicator:hover { opacity: 1; }
#player:is(:fullscreen, .touch-fullscreen).tools-visible #edge-indicator { opacity: .22; }
#edge-indicator > span:first-child {
    position: relative; display: block; box-sizing: border-box; width: 64px; height: 18px; margin: 3px auto 0;
    border: 1px solid #c5aaa28c; border-top-color: #ad3d35b8; border-radius: 2px 2px 9px 9px;
    background: #21191ae8; box-shadow: 0 2px 6px #000c, inset 0 1px #ffffff12;
    backdrop-filter: blur(5px); transition: background .18s ease, border-color .18s ease;
}
#edge-indicator > span:first-child::before {
    content: ""; position: absolute; left: 28px; top: 3px; width: 7px; height: 7px;
    border: solid #f0e4de; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
#edge-indicator > span:first-child::after {
    content: ""; position: absolute; left: 9px; top: 7px; width: 3px; height: 3px;
    border-radius: 50%; background: #d14a3e; box-shadow: 0 0 3px #d14a3e88;
}
#edge-indicator:hover > span:first-child { background: #302224f2; border-color: #e0c8bdc9; border-top-color: #ef5146; }
#edge-indicator span.edge-label {
    position: absolute; top: 20px; right: 0; display: none; width: max-content; height: auto; max-width: min(240px, calc(100vw - 24px)); margin: 0;
    padding: 5px 9px; border: 1px solid #8d443b; border-radius: 2px; background: #21191af2;
    color: #f5d4c6; box-shadow: 0 2px 8px #000b; font: 600 11px/1.25 system-ui, sans-serif; text-align: right;
}
#edge-indicator.online-active .edge-label { display: block; }
#edge-indicator.online-request .edge-label { border-color: #e34238; color: #fff; }
#player:is(:fullscreen, .touch-fullscreen).tools-visible:not(.tools-collapsed) #edge-indicator.online-active { opacity: .85; }
#online-controls #online-collapse-tools { display: none; }
#player:is(:fullscreen, .touch-fullscreen) #online-controls #online-collapse-tools { display: inline-block; }
#audio-control { position: relative; }
#audio-toggle {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-width: 44px; padding: 10px 13px; background: #211a1a;
    transform: none; transition: background .15s, border-color .15s;
}
#audio-toggle svg { width: 17px; height: 17px; fill: currentColor; flex: none; }
#audio-toggle .speaker-waves { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
#audio-control[data-muted="true"] #audio-toggle { color: #d9aaa0; }
.speaker-cross { display: none; fill: none !important; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
#audio-control[data-muted="true"] .speaker-waves,
#audio-control[data-muted="true"] #mute-toggle .speaker-waves { display: none; }
#audio-control[data-muted="true"] .speaker-cross { display: block; }
#volume-panel {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 8;
    box-sizing: border-box; width: 256px; padding: 15px 16px 12px;
    color: #f5efea; background: #181314f5; border: 1px solid #76534a;
    border-top: 2px solid #ad241f; box-shadow: 0 12px 36px #000b;
    transform: skew(0); backdrop-filter: blur(14px);
}
#volume-panel[hidden] { display: none; }
.volume-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; }
#mute-toggle {
    display: grid; place-items: center; width: 34px; height: 32px; padding: 6px;
    border-color: #71504b; transform: none;
}
#mute-toggle svg { width: 17px; height: 17px; fill: currentColor; }
.volume-slider-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.volume-slider-row svg { width: 16px; height: 16px; fill: #cdb9b1; flex: none; }
#volume-slider { width: 100%; min-width: 0; accent-color: #e34238; cursor: pointer; touch-action: pan-y; }
#volume-value { min-width: 34px; color: #f2c3b0; text-align: right; font-variant-numeric: tabular-nums; }
#volume-status { min-height: 1.2em; margin-top: 9px; color: #aa9993; font-size: 10px; }
#audio-control:focus-within #volume-panel { outline: none; }
#toolbar button { flex: none; }
#player:is(:fullscreen, .touch-fullscreen) #feedback {
    position: absolute; bottom: 28px; z-index: 5; margin: 0 20px; min-height: 0;
    padding: 12px 20px; background: #100d0ee8; border-left: 3px solid #df392e;
    color: #fff; pointer-events: none; opacity: 0;
}
#player:is(:fullscreen, .touch-fullscreen).tools-visible #feedback { opacity: 1; }
@media (max-width: 600px) {
    #toolbar { padding-top: 14px; }
    #brand { flex: 1 1 100%; justify-content: space-between; }
    button { padding: 9px 12px; }
    #toolbar strong small { letter-spacing: 2px; }
    #volume-panel { width: min(256px, calc(100vw - 24px)); }
    #online-controls { flex: 1 1 100%; }
    #online-status { max-width: 100%; flex: 1 1 100%; }
    #player:is(:fullscreen, .touch-fullscreen) #online-controls { flex: 1 1 100%; }
    #player:is(:fullscreen, .touch-fullscreen) #online-status { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
    button, #player:is(:fullscreen, .touch-fullscreen) #toolbar, #player:is(:fullscreen, .touch-fullscreen) #edge-indicator,
    #player:is(:fullscreen, .touch-fullscreen) #feedback { transition: none; }
}
#touch-pad, #rotate-hint { display: none; }
#player.touch-fullscreen {
    position: fixed; z-index: 20;
    top: var(--visible-top, 0px); left: var(--visible-left, 0px);
    width: var(--visible-width, 100%); height: var(--visible-height, 100dvh);
}
#player:is(:fullscreen, .touch-fullscreen) { touch-action: none; overscroll-behavior: none; }
html:has(#player.touch-fullscreen), body:has(#player.touch-fullscreen) { overflow: hidden; }
@media (orientation: portrait) {
    #player.touch-playing #rotate-hint {
        display: block; position: absolute; bottom: 8%; color: #e3d2ca;
    }
}
@media (orientation: landscape) {
    #player.touch-playing #touch-pad:not([hidden]) {
        display: block; position: absolute; inset: 0; z-index: 4; pointer-events: none;
        --touch-key: max(44px, calc(clamp(44px, 5.52vw, 48px) * var(--action-scale, 1)));
    }
    #player.touch-playing.touch-layout #viewport {
        position: absolute; top: 50%; left: var(--game-center); transform: translate(-50%, -50%);
        width: var(--game-width); height: auto;
    }
}
#touch-stick, #touch-cross, #touch-actions {
    position: absolute; bottom: max(12%, env(safe-area-inset-bottom)); pointer-events: auto;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#touch-stick {
    left: max(7px, env(safe-area-inset-left)); width: calc(clamp(108px, 29dvh, 124px) * var(--direction-scale, 1)); aspect-ratio: 1;
    border: 1px solid #cfb6ac; border-radius: 50%; box-sizing: border-box;
    background: radial-gradient(circle, transparent 19%, #c4a99d66 20% 21%, transparent 22%), rgb(28 22 25 / .35);
}
#touch-stick span, #touch-knob {
    position: absolute; top: 50%; left: 50%; pointer-events: none;
    transform: translate(-50%, -50%) translate(var(--x, 0px), var(--y, 0px));
}
#touch-stick span { color: white; font: 600 calc(16px * var(--direction-scale, 1)) system-ui; text-shadow: 0 1px 3px black; }
#touch-stick span.active { color: #ffeaa7; }
#touch-knob {
    width: 35%; aspect-ratio: 1; border: 1px solid #c7a59a; border-radius: 50%;
    background: #3c2b2ee0; box-shadow: 0 2px 4px #0006;
}
#touch-stick.held #touch-knob { background: #8f403aeb; border-color: #ffd6c3; }
#touch-actions { right: max(7px, env(safe-area-inset-right)); display: grid; grid-template-columns: repeat(3, var(--touch-key)); gap: 4px; }
#touch-actions button {
    width: var(--touch-key); height: var(--touch-key); padding: 0; transform: none; border: 1px solid #cdb9b4;
    border-radius: 9px; color: white; font: 650 18px/1 system-ui; text-shadow: 0 1px 2px #000, 0 0 3px #000;
    background: linear-gradient(to right, #211c20 0 var(--start,100%), rgb(25 20 24 / .35) var(--start,100%) var(--end,100%), #211c20 var(--end,100%) 100%);
}
#touch-actions button[aria-pressed=true] { background: #983e32bf; border-color: #ffdaaa; }
#touch-actions small { display: block; margin-top: 2px; font: 550 10px/1.2 system-ui; }
#touch-actions.menu { grid-template-columns: repeat(2, var(--touch-key)); }

#touch-pad [hidden], #touch-settings[hidden], #touch-settings-open[hidden] { display: none; }
#touch-cross {
    left: max(7px, env(safe-area-inset-left)); display: grid; gap: 2px;
    --arrow-size: max(44px, calc(48px * var(--direction-scale, 1)));
    grid-template: repeat(3, var(--arrow-size)) / repeat(3, var(--arrow-size));
}
#touch-cross button { padding: 0; transform: none; border-radius: 8px; background: #291f24aa; border-color: #cfb6ac; font-size: 19px; }
#touch-cross button[aria-pressed=true] { background: #983e32bf; }
#touch-cross [data-slot=w] { grid-area: 1 / 2; }
#touch-cross [data-slot=a] { grid-area: 2 / 1; }
#touch-cross [data-slot=d] { grid-area: 2 / 3; }
#touch-cross [data-slot=s] { grid-area: 3 / 2; }
#touch-pad.swapped :is(#touch-stick, #touch-cross) { left: auto; right: max(7px, env(safe-area-inset-right)); }
#touch-pad.swapped #touch-actions { right: auto; left: max(7px, env(safe-area-inset-left)); }
#touch-actions.arc:not(.menu) { width: calc(4.2 * var(--touch-key)); height: calc(3 * var(--touch-key)); display: block; }
#touch-actions.arc:not(.menu) button {
    position: absolute; left: calc(var(--x) * var(--touch-key)); top: calc(var(--y) * var(--touch-key));
    transform: translate(-50%, -50%); border-radius: 50%;
}
#touch-actions.arc:not(.menu) [data-slot=j] {
    --x: 2.1; --y: 2.2; width: calc(1.5 * var(--touch-key)); height: calc(1.5 * var(--touch-key));
    border-color: #ffae8a; background-color: #7c3026cc; background-image: none; font-size: 24px;
}
#touch-actions.arc:not(.menu) [data-slot=j][aria-pressed=true] { background: #b74d36; }
#touch-actions [data-slot=k] { --x: .5; --y: 2.2; }
#touch-actions [data-slot=u] { --x: .95; --y: 1.05; }
#touch-actions [data-slot=i] { --x: 2.1; --y: .5; }
#touch-actions [data-slot=o] { --x: 3.25; --y: 1.05; }
#touch-actions [data-slot=l] { --x: 3.7; --y: 2.2; }
#touch-settings {
    position: absolute; z-index: 8; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: min(430px, 94%); box-sizing: border-box; max-height: 92%; overflow: auto;
    padding: 10px 14px; border: 1px solid #795f54; border-top: 3px solid #ee6851;
    border-radius: 8px; background: #201a1bf5; color: #fff4ea;
}
#touch-settings header, #touch-settings footer, #touch-settings .setting-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
#touch-settings header { padding-bottom: 5px; border-bottom: 1px solid #523c3a; }
#touch-settings footer { margin-top: 6px; font-size: 12px; color: #c5b1a9; }
#touch-settings .setting-row { margin-top: 5px; }
#touch-settings button { padding: 5px 10px; transform: none; border-radius: 4px; }
#touch-settings button[aria-pressed=true], #touch-settings-done { background: #84372e; border-color: #e87e66; }
#touch-settings input { flex: 1; max-width: 155px; min-width: 50px; accent-color: #ed7358; }
#touch-settings label { margin-right: auto; }
#touch-settings output { min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
        </style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
        <main id="player">
        <nav id="toolbar" aria-label="游戏工具">
            <div id="brand">
                <strong>死神 <span>VS</span> 火影 <span>2.6</span><small>BLEACH VS NARUTO</small></strong>
                <a id="repository" href="https://github.com/fengkx/bvn26" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开 GitHub 项目仓库">
                    GitHub
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12 12 4M4.5 4H12v7.5"/></svg>
                </a>
            </div>
            <section id="online-controls" aria-label="联机对战控制" hidden>
                <span id="online-status" role="status" aria-live="polite"></span>
                <span id="online-request" hidden></span>
                <button id="online-pause" type="button" hidden></button>
                <button id="online-accept-pause" type="button" hidden>同意</button>
                <button id="online-refuse-pause" type="button" hidden>拒绝</button>
                <button id="online-skip-intro" type="button" hidden>请求跳过开场</button>
                <button id="online-exit" type="button" hidden></button>
                <button id="online-collapse-tools" type="button" aria-label="收起游戏工具" title="收起">收起</button>
            </section>
            <div id="audio-control" data-muted="false">
                <button id="audio-toggle" type="button" aria-label="音量设置" aria-expanded="false" aria-controls="volume-panel" title="音量设置">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m2-9a7 7 0 0 1 0 12"></path><path class="speaker-cross" d="m16 10 5 5m0-5-5 5"></path></svg>
                </button>
                <section id="volume-panel" aria-label="音量控制" hidden>
                    <div class="volume-heading">
                        <span>主音量</span>
                        <button id="mute-toggle" type="button" aria-label="静音" title="静音">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path><path class="speaker-waves" d="M15 9a4 4 0 0 1 0 6m2-9a7 7 0 0 1 0 12"></path><path class="speaker-cross" d="m16 10 5 5m0-5-5 5"></path></svg>
                        </button>
                    </div>
                    <div class="volume-slider-row">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"></path></svg>
                        <input id="volume-slider" type="range" min="0" max="100" step="1" value="72" aria-label="主音量">
                        <output id="volume-value" for="volume-slider">72%</output>
                    </div>
                    <div id="volume-status" role="status" aria-live="polite">等待游戏音频初始化</div>
                </section>
            </div>
            <button id="fullscreen" type="button">进入全屏</button>
            <button id="download" type="button">导出日志</button>
        </nav>
        <button id="edge-indicator" type="button" aria-label="显示游戏工具"><span aria-hidden="true"></span><span class="edge-label" hidden></span></button>
        <p id="help">点击画面，开始对战 · 全屏沉浸游玩 · 遇到问题可导出日志反馈</p>
        <div id="viewport">
        <canvas id="canvas" tabindex="0">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">

            record('warn', 'Build metadata unavailable', error);
            return null;
        } finally {
            clearTimeout(timeout);
        }
    })();

    function makeRunReportId(prefix) {
        return `${prefix}-${sessionId}-${Math.random().toString(36).slice(2, 9)}`;
    }
    function trimRuntimeEvents(nowMonoMs = performance.now()) {
        const cutoff = nowMonoMs - logWindowMs;
        while (runtimeEventCount && runtimeEvents[runtimeEventHead].receivedMonoMs < cutoff) {
            discardOldestRuntimeEvent('age');
        }
        while (runtimeEventCount > runtimeEventLimit) {
            discardOldestRuntimeEvent('count');
        }
        while (runtimeEventBytes > runtimeByteLimit && runtimeEventCount) {
            discardOldestRuntimeEvent('bytes');
        }
    }

    function discardOldestRuntimeEvent(reason) {
        const item = runtimeEvents[runtimeEventHead];
        runtimeEvents[runtimeEventHead] = null;
        runtimeEventHead++;
        runtimeEventCount--;
        runtimeEventBytes -= item.byteLength;
        runtimeDropped[reason]++;
        // Occasional compaction keeps the hot path O(1) without retaining old payloads.
        if (runtimeEventHead >= 256 && runtimeEventHead * 2 >= runtimeEvents.length) {
            runtimeEvents.splice(0, runtimeEventHead);
            runtimeEventHead = 0;
        }
    }

    function appendRuntimeEvent(event) {
        if (!event || typeof event !== 'object' || Array.isArray(event) || typeof event.type !== 'string') {
            rejectedRuntimeEvents++;
            return false;
        }
        const receivedMonoMs = performance.now();
        const entry = {
            ...event,
            origin: event.origin || 'runtime',
            runId: sessionId,
            receivedAt: new Date().toISOString(),
            receivedMonoMs,
        };
        const encoder = new TextEncoder();
        const byteLength = encoder.encode(JSON.stringify(entry)).byteLength;
        if (byteLength > runtimeEventLimitBytes) {
            rejectedRuntimeEvents++;
            return false;
        }
        if (typeof entry.buildID === 'string') runtimeBuildId = entry.buildID;
        runtimeEvents.push({ event: entry, byteLength, receivedMonoMs });
        runtimeEventCount++;
        runtimeEventBytes += byteLength;
        for (let index = activeIncidents.length - 1; index >= 0; index--) {
            const incident = activeIncidents[index];
            if (receivedMonoMs <= incident.endsMonoMs) {
                appendIncidentEvent(incident, { event: entry, byteLength });
            } else {
                incident.status = 'window_complete';
                activeIncidents.splice(index, 1);
            }
        }
        if (event.type === 'pause_state' || event.type === 'diagnostic_exception') {
            criticalEvents.push(entry);
            if (criticalEvents.length > criticalEventLimit) {
                criticalEvents.shift();
                criticalDropped++;
            }
            beginCriticalIncident(entry, receivedMonoMs);
        }
        trimRuntimeEvents(receivedMonoMs);
        return true;
    }

    function appendIncidentEvent(incident, item) {
        incident.events.push(item.event);
        incident.bytes += item.byteLength;
        while (incident.events.length > incidentEventLimit || incident.bytes > incidentByteLimit) {
            const removed = incident.events.shift();
            incident.bytes -= new TextEncoder().encode(JSON.stringify(removed)).byteLength;
            incident.droppedEvents++;
        }
    }

    function beginCriticalIncident(trigger, triggerMonoMs) {
        const incident = {
            trigger,
            startMonoMs: Math.max(0, triggerMonoMs - incidentWindowBeforeMs),
            triggerMonoMs,
            endsMonoMs: triggerMonoMs + incidentWindowAfterMs,
            status: 'collecting',
            events: [],
            bytes: 0,
            droppedEvents: 0,
        };
        const retained = runtimeEvents.slice(runtimeEventHead, runtimeEventHead + runtimeEventCount);
        for (const item of retained) {
            if (item.receivedMonoMs >= incident.startMonoMs && item.receivedMonoMs <= incident.endsMonoMs) {
                appendIncidentEvent(incident, item);
            }
        }
        if (criticalIncidents.length >= incidentLimit) {
            const removed = criticalIncidents.shift();
            const activeIndex = activeIncidents.indexOf(removed);
            if (activeIndex >= 0) activeIncidents.splice(activeIndex, 1);
            incidentDropped++;
        }
        criticalIncidents.push(incident);
        activeIncidents.push(incident);
    }

    function appendShellEvent(type, payload) {
        shellEventSeq++;
        return appendRuntimeEvent({
            type,
            origin: 'shell',
            shellSeq: shellEventSeq,
            monoMs: performance.now(),
            payload,
        });
    }

    const rtcConnectionLimit = 8;
    const rtcSampleLimit = 60;
    const rtcStateHistoryLimit = 16;
    const rtcSampleIntervalMs = 3000;
    const rtcConnections = [];
    let rtcNextConnectionId = 1;
    let rtcDroppedConnections = 0;
    let rtcSampleTimer = null;
    let rtcConstructorHookStatus = 'unavailable';

    function rtcState(value, allowed) {
        return typeof value === 'string' && allowed.includes(value) ? value : 'unknown';
    }

    function rtcCandidateType(value) {
        return ['host', 'srflx', 'prflx', 'relay'].includes(value) ? value : 'unknown';
    }

    function rtcCounter(value) {
        return typeof value === 'number' && Number.isFinite(value) && value >= 0
            ? Math.round(value) : null;
    }

    function rtcSnapshot() {
        return {
            available: rtcConstructorHookStatus === 'active',
            constructorHookStatus: rtcConstructorHookStatus,
            roleBinding: 'unclassified',
            rttMeaning: 'ICE STUN connectivity/consent measurement; not input end-to-end latency',
            connectionLimit: rtcConnectionLimit,
            sampleIntervalMs: rtcSampleIntervalMs,
            sampleLimitPerConnection: rtcSampleLimit,
            droppedConnections: rtcDroppedConnections,
            connections: rtcConnections.map(connection => ({
                localId: connection.localId,
                role: connection.role,
                createdAt: connection.createdAt,
                createdMonoMs: connection.createdMonoMs,
                connectionState: connection.connectionState,
                iceConnectionState: connection.iceConnectionState,
                stateHistory: connection.stateHistory.slice(),
                endedAt: connection.endedAt,
                endedMonoMs: connection.endedMonoMs,
                endedReason: connection.endedReason,
                sampleCount: connection.sampleCount,
                droppedSamples: connection.droppedSamples,
                statsErrorCount: connection.statsErrorCount,
                lastSampleStatus: connection.lastSampleStatus,
                selectedPair: connection.selectedPair
                    ? { ...connection.selectedPair }
                    : null,
                samples: connection.samples.slice(),
            })),
        };
    }

    function recordRtcState(connection) {
        const peer = connection.peer;
        if (!peer) return;
        let nextConnectionState = 'unknown';
        let nextIceConnectionState = 'unknown';
        try {
            nextConnectionState = rtcState(peer.connectionState,
                ['new', 'connecting', 'connected', 'disconnected', 'failed', 'closed']);
            nextIceConnectionState = rtcState(peer.iceConnectionState,
                ['new', 'checking', 'connected', 'completed', 'disconnected', 'failed', 'closed']);
        } catch (_) {}
        if (nextConnectionState === connection.connectionState
                && nextIceConnectionState === connection.iceConnectionState) return;
        connection.connectionState = nextConnectionState;
        connection.iceConnectionState = nextIceConnectionState;
        connection.stateHistory.push({
            monoMs: Math.max(0, performance.now()),
            connectionState: nextConnectionState,
            iceConnectionState: nextIceConnectionState,
        });
        if (connection.stateHistory.length > rtcStateHistoryLimit) connection.stateHistory.shift();
        if (nextConnectionState === 'failed' || nextConnectionState === 'closed'
                || nextIceConnectionState === 'failed' || nextIceConnectionState === 'closed') {
            releaseRtcPeer(connection,
                nextConnectionState === 'failed' || nextIceConnectionState === 'failed' ? 'failed' : 'closed');
        }
    }

    function releaseRtcPeer(connection, reason, endedAt = new Date().toISOString(),
            endedMonoMs = Math.max(0, performance.now())) {
        const peer = connection.peer;
        if (!peer) return;
        for (const listener of connection.stateListeners) {
            try { peer.removeEventListener(listener.name, listener.callback); } catch (_) {}

        connection.stateListeners.length = 0;
        connection.peer = null;
        connection.endedAt = endedAt;
        connection.endedMonoMs = endedMonoMs;
        connection.endedReason = reason;
    }

    function rtcStatsSummary(report) {
        const records = [];
        if (report && typeof report.forEach === 'function') {
            report.forEach(stat => { if (stat && typeof stat === 'object') records.push(stat); });
        } else if (report && typeof report[Symbol.iterator] === 'function') {
            for (const stat of report) {
                const value = Array.isArray(stat) ? stat[1] : stat;
                if (value && typeof value === 'object') records.push(value);
            }
        }
        const findById = id => records.find(stat => stat.id === id) || null;
        let selectedPair = null;
        for (const stat of records) {
            if (stat.type === 'transport' && typeof stat.selectedCandidatePairId === 'string') {
                selectedPair = findById(stat.selectedCandidatePairId);
                if (selectedPair) break;
            }
        }
        if (!selectedPair || selectedPair.type !== 'candidate-pair') {
            return { status: 'selected_pair_unavailable', rttMs: null,
                localCandidateType: 'unknown', remoteCandidateType: 'unknown',
                protocol: null,
                bytesSent: null, bytesReceived: null, packetsSent: null, packetsReceived: null };
        }
        const rttMs = typeof selectedPair.currentRoundTripTime === 'number'
                && Number.isFinite(selectedPair.currentRoundTripTime)
                && selectedPair.currentRoundTripTime >= 0
            ? Math.round(selectedPair.currentRoundTripTime * 1000 * 10) / 10 : null;
        const localCandidate = findById(selectedPair.localCandidateId);
        const remoteCandidate = findById(selectedPair.remoteCandidateId);
        return {
            status: 'available',
            localCandidateType: rtcCandidateType(localCandidate?.candidateType),
            remoteCandidateType: rtcCandidateType(remoteCandidate?.candidateType),
            protocol: rtcTransportProtocol(selectedPair, localCandidate, remoteCandidate),
            rttMs,
            ...rtcPairQuality(selectedPair),
            bytesSent: rtcCounter(selectedPair.bytesSent),
            bytesReceived: rtcCounter(selectedPair.bytesReceived),
            packetsSent: rtcCounter(selectedPair.packetsSent),
            packetsReceived: rtcCounter(selectedPair.packetsReceived),
        };
    }

    function rtcTransportProtocol(pair, localCandidate, remoteCandidate) {
        for (const source of [pair, localCandidate, remoteCandidate]) {
            const protocol = source && source.protocol;
            if (protocol === 'udp' || protocol === 'tcp') return protocol;
        }
        return null;
    }

    // Data channels do not produce inbound-rtp. Read optional quality only from
    // the selected candidate pair, and omit the keys when the pair has neither.
    function rtcPairQuality(pair) {
        const quality = {};
        if (pair && typeof pair.jitter === 'number' && Number.isFinite(pair.jitter) && pair.jitter >= 0)
            quality.jitterMs = Math.round(pair.jitter * 1000 * 10) / 10;
        if (pair && typeof pair.packetsLost === 'number' && Number.isFinite(pair.packetsLost) && pair.packetsLost >= 0)
            quality.packetsLost = Math.round(pair.packetsLost);
        return quality;
    }

    function noteSelectedPair(connection, summary) {
        if (!summary || summary.status !== 'available') return;
        const protocol = summary.protocol || 'unknown';
        const signature = `${summary.localCandidateType}|${summary.remoteCandidateType}|${protocol}`;
        if (signature === connection.selectedPairSignature) return;
        connection.selectedPairSignature = signature;
        connection.selectedPair = {
            localCandidateType: summary.localCandidateType,
            remoteCandidateType: summary.remoteCandidateType,
            protocol,
        };
        appendShellEvent('ice_selected_pair', connection.selectedPair);
    }

    function sampleRtcConnection(connection) {
        const peer = connection.peer;
        if (!peer || connection.samplePending) return;
        connection.samplePending = true;
        try {
            Promise.resolve(peer.getStats()).then(report => {
                if (connection.peer !== peer) return;
                const sample = {
                    monoMs: Math.max(0, performance.now()),
                    ...rtcStatsSummary(report),
                };
                noteSelectedPair(connection, sample);
                connection.lastSampleStatus = sample.status;
                connection.sampleCount++;
                connection.samples.push(sample);
                if (connection.samples.length > rtcSampleLimit) {
                    connection.samples.shift();
                    connection.droppedSamples++;
                }
            }).catch(() => {
                if (connection.peer !== peer) return;
                connection.statsErrorCount++;
                connection.lastSampleStatus = 'error';
            }).finally(() => {
                connection.samplePending = false;
            });
        } catch (_) {
            connection.samplePending = false;
            connection.statsErrorCount++;
            connection.lastSampleStatus = 'error';
        }
    }

    function sampleRtcConnections() {
        for (const connection of rtcConnections) {
            if (connection.peer) {
                recordRtcState(connection);
                sampleRtcConnection(connection);
            }
        }
        if (!rtcConnections.some(connection => connection.peer) && rtcSampleTimer !== null) {
            clearInterval(rtcSampleTimer);
            rtcSampleTimer = null;
        }
    }

    function trackRtcConnection(peer) {
        while (rtcConnections.length >= rtcConnectionLimit) {
            const finishedIndex = rtcConnections.findIndex(connection => connection.peer === null);
            if (finishedIndex < 0) {
                rtcDroppedConnections++;
                return;
            }
            rtcConnections.splice(finishedIndex, 1);
            rtcDroppedConnections++;
        }
        const connection = {
            localId: rtcNextConnectionId++,
            role: 'unclassified',
            peer,
            createdAt: new Date().toISOString(),
            createdMonoMs: Math.max(0, performance.now()),
            connectionState: 'unknown',
            iceConnectionState: 'unknown',
            stateHistory: [],
            stateListeners: [],
            endedAt: null,
            endedMonoMs: null,
            endedReason: null,
            samplePending: false,
            sampleCount: 0,
            droppedSamples: 0,
            statsErrorCount: 0,
            lastSampleStatus: 'pending',
            samples: [],
        };
        rtcConnections.push(connection);
        recordRtcState(connection);
        if (connection.peer && peer && typeof peer.addEventListener === 'function') {
            for (const name of ['connectionstatechange', 'iceconnectionstatechange']) {
                const callback = () => recordRtcState(connection);
                try {
                    peer.addEventListener(name, callback);
                    connection.stateListeners.push({ name, callback });
                } catch (_) {}
            }
        }
        if (connection.peer && rtcSampleTimer === null) {
            rtcSampleTimer = setInterval(sampleRtcConnections, rtcSampleIntervalMs);
        }
    }

    function installRtcDiagnosticsHook() {
        const nativeConstructor = window.RTCPeerConnection;
        if (typeof nativeConstructor !== 'function') {
            rtcConstructorHookStatus = 'native_constructor_unavailable';
            return;
        }
        try {
            let diagnosticConstructor;
            diagnosticConstructor = new Proxy(nativeConstructor, {
                construct(target, args, newTarget) {
                    const peer = Reflect.construct(target, args,
                        newTarget === diagnosticConstructor ? target : newTarget);
                    try { trackRtcConnection(peer); } catch (_) {}
                    return peer;
                },
            });
            window.RTCPeerConnection = diagnosticConstructor;
            rtcConstructorHookStatus = window.RTCPeerConnection === diagnosticConstructor
                ? 'active' : 'constructor_not_writable';
        } catch (_) {
            rtcConstructorHookStatus = 'constructor_not_writable';
        }
    }

    installRtcDiagnosticsHook();
    window.addEventListener('pagehide', () => {
        if (rtcSampleTimer !== null) clearInterval(rtcSampleTimer);
        rtcSampleTimer = null;
        const endedAt = new Date().toISOString();
        const endedMonoMs = Math.max(0, performance.now());
        for (const connection of rtcConnections) {
            releaseRtcPeer(connection, 'pagehide', endedAt, endedMonoMs);
        }
    });

    window.bvnDiagnosticsGetContext = () => JSON.stringify({
        schemaVersion: 2,
        runId: sessionId,
        buildSidecar,
        buildSidecarStatus,
    });
    window.bvnDiagnosticsPush = serialized => {
        if (typeof serialized !== 'string' || serialized.length > runtimeEventLimitBytes) {
            rejectedRuntimeEvents++;
            return false;
        }
        try {
            return appendRuntimeEvent(JSON.parse(serialized));
        } catch (_) {
            rejectedRuntimeEvents++;
            return false;
        }
    };
    window.bvnDiagnosticsSetSnapshot = serialized => {
        if (typeof serialized !== 'string' || serialized.length > runtimeEventLimitBytes) {
            rejectedRuntimeEvents++;
            return false;
        }
        try {
            const snapshot = JSON.parse(serialized);
            if (!snapshot || typeof snapshot !== 'object' || Array.isArray(snapshot)) {
                rejectedRuntimeEvents++;
                return false;
            }
            latestRuntimeSnapshot = snapshot;
            if (typeof snapshot.buildID === 'string') runtimeBuildId = snapshot.buildID;
            const waiter = snapshotWaiters.get(snapshot.requestId);
            if (waiter) {
                clearTimeout(waiter.timeout);
                snapshotWaiters.delete(snapshot.requestId);
                waiter.resolve({ status: 'acknowledged', snapshot });
            }
            return true;
        } catch (_) {
            rejectedRuntimeEvents++;
            return false;
        }
    };
    window.bvnDiagnosticsRegister = callback => {
        diagnosticsRequestCallback = typeof callback === 'function' ? callback : null;
        if (diagnosticsRequestCallback) diagnosticsRequestCallback('visibility', document.visibilityState);
    };
    window.bvnDiagnosticsUnregister = callback => {
        if (!callback || callback === diagnosticsRequestCallback) diagnosticsRequestCallback = null;
    };

    // Estimate fight simulation Hz from retained input_consumed samples.
    // Meaning: tickDelta / wallSeconds over one contiguous match segment.
    // Group by matchId and cut on fightTick rollback so menu dwell / scene
    // recreation cannot dilute or invert the rate. Prefer the latest usable
    // segment (current match), not the whole rolling window.
    function rollingTickClock(events) {
        const samples = [];
        for (const event of events || []) {
            if (!event || event.type !== 'input_consumed') continue;
            if (typeof event.fightTick !== 'number' || typeof event.monoMs !== 'number') continue;
            samples.push(event);
        }
        if (samples.length < 2) return null;

        const matchKey = event => (typeof event.matchId === 'string' && event.matchId)
            ? event.matchId
            : null;

        let best = null;
        let start = 0;
        const consider = end => {
            if (end - start < 2) return;
            const first = samples[start];
            const last = samples[end - 1];
            const wallMs = last.monoMs - first.monoMs;
            // Interval between endpoints, not an inclusive endpoint count.
            const tickDelta = last.fightTick - first.fightTick;
            if (!(wallMs > 0) || !(tickDelta > 0)) return;
            best = {
                matchId: matchKey(first),
                tickDelta,
                wallMs,
                hz: tickDelta / (wallMs / 1000),
                firstFightTick: first.fightTick,
                lastFightTick: last.fightTick,
                sampleCount: end - start,
            };
        };

        for (let i = 1; i <= samples.length; i++) {
            const cut = i === samples.length
                || matchKey(samples[i]) !== matchKey(samples[i - 1])
                || samples[i].fightTick < samples[i - 1].fightTick
                || samples[i].monoMs < samples[i - 1].monoMs;
            if (cut) {
                consider(i);
                start = i;
            }
        }
        return best;
    }

    function requestRuntimeSnapshot() {
        if (!diagnosticsRequestCallback) return Promise.resolve({ status: 'runtime_unavailable', snapshot: latestRuntimeSnapshot });
        const requestId = makeRunReportId('snapshot');
        return new Promise(resolve => {
            const timeout = setTimeout(() => {
                snapshotWaiters.delete(requestId);
                resolve({ status: 'timeout', snapshot: latestRuntimeSnapshot });
            }, 1000);
            snapshotWaiters.set(requestId, { resolve, timeout });
            try {
                diagnosticsRequestCallback('snapshot', requestId);
            } catch (error) {
                clearTimeout(timeout);
                snapshotWaiters.delete(requestId);
                resolve({ status: 'request_error', error: format(error), snapshot: latestRuntimeSnapshot });
            }
        });

    record('session', 'Web player started');
    const available = document.fullscreenEnabled && player.requestFullscreen;

    document.getElementById('download').addEventListener('click', async () => {

            page: location.origin + location.pathname,
            userAgent: navigator.userAgent, language: navigator.language,
            viewport: { width: innerWidth, height: innerHeight, devicePixelRatio },

        const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }));
        const link = document.createElement('a');

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine({
    ...GODOT_CONFIG,
    onPrint: (...args) => console.log(...args),
    onPrintError: (...args) => console.error(...args),
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

	<script type="module">
if (window.bvnMobileGamepadEnabled) initializeTouchControls();

function initializeTouchControls() {
    const player = document.getElementById('player');
    const pad = document.getElementById('touch-pad');
    const stick = document.getElementById('touch-stick');
    const knob = document.getElementById('touch-knob');
    const actions = document.getElementById('touch-actions');
    const cross = document.getElementById('touch-cross');
    const settings = document.getElementById('touch-settings');
    const openSettings = document.createElement('button');
    openSettings.id = 'touch-settings-open';
    openSettings.textContent = '触控设置';
    openSettings.hidden = true;
    openSettings.setAttribute('aria-controls', settings.id);
    openSettings.setAttribute('aria-expanded', 'false');
    document.getElementById('toolbar').insertBefore(openSettings, document.getElementById('fullscreen'));
    const storageKey = 'bvn.touchSettings.v1';
    const defaults = { hand: 'left', direction: 'stick', actions: 'grid', directionSize: 100, actionSize: 100 };
    const preferences = { ...defaults };
    const choices = [...settings.querySelectorAll('[data-setting]')];
    const sliders = [...settings.querySelectorAll('input[type=range]')];
    try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        for (const { dataset, value } of choices) {
            if (saved?.[dataset.setting] === value) preferences[dataset.setting] = value;
        }
        for (const slider of sliders) {
            const size = saved?.[slider.id];
            if (Number.isInteger(size) && size >= +slider.min && size <= +slider.max && size % +slider.step === 0) {
                preferences[slider.id] = size;
            }
        }
    } catch { /* Storage can be unavailable in private browsing. */ }
    function applyPreferences() {
        const swapped = preferences.hand === 'right';
        pad.classList.toggle('swapped', swapped);
        stick.hidden = preferences.direction !== 'stick';
        cross.hidden = !stick.hidden;
        actions.classList.toggle('arc', preferences.actions === 'arc');
        pad.style.setProperty('--direction-scale', preferences.directionSize / 100);
        pad.style.setProperty('--action-scale', preferences.actionSize / 100);
        for (const button of choices) {
            button.setAttribute('aria-pressed', String(button.value === preferences[button.dataset.setting]));
        }
        for (const slider of sliders) {
            slider.value = preferences[slider.id];
            settings.querySelector('output[for="' + slider.id + '"]').value = slider.value + '%';
        }
        settings.querySelector('label[for=directionSize]').textContent = (swapped ? '右侧' : '左侧') + '方向区大小';
        settings.querySelector('label[for=actionSize]').textContent = (swapped ? '左侧' : '右侧') + '动作键大小';
        layout();
    }
    function savePreferences() {
        release();
        applyPreferences();
        try { localStorage.setItem(storageKey, JSON.stringify(preferences)); } catch { /* Session-only settings. */ }
    }
    for (const button of choices) button.onclick = () => {
        window.tinytraffic?.('Change Touch Layout', { props: { setting: button.dataset.setting, value: button.value } });
        preferences[button.dataset.setting] = button.value;
        savePreferences();
    };
    for (const slider of sliders) slider.oninput = () => {
        preferences[slider.id] = Number(slider.value);
        savePreferences();
    };
    settings.querySelector('#touch-settings-reset').onclick = () => {
        Object.assign(preferences, defaults);
        savePreferences();
    };
    function showSettings(open) {
        if (open === !settings.hidden) return;
        release();
        settings.hidden = !open;
        openSettings.setAttribute('aria-expanded', String(open));
    }
    openSettings.onclick = () => {
        window.tinytraffic?.(settings.hidden ? 'Open Touch Settings' : 'Close Touch Settings');
        showSettings(settings.hidden);
    };
    settings.querySelector('#touch-settings-done').onclick = () => {
        showSettings(false);
        document.getElementById('canvas').focus({ preventScroll: true });
    };
    const pause = document.createElement('button');
    pause.type = 'button';
    pause.textContent = '暂停游戏';
    pause.hidden = true;
    document.getElementById('toolbar').insertBefore(pause, document.getElementById('fullscreen'));
    pause.onclick = () => { callback?.(-2); document.getElementById('canvas').focus({ preventScroll: true }); };
    const landscape = matchMedia('(orientation: landscape)');
    const keys = 'wsadjkluio';
    const sectors = ['d', 'sd', 's', 'sa', 'a', 'wa', 'w', 'wd'];
    const labels = { u: '技能', i: '必杀', o: '援助', j: '攻击', k: '跳跃', l: '冲刺' };
    const touches = new Map();
    let callback, mode = 'hidden', direction = '', owner = null, lastMask = 0;
    for (const [key, label] of Object.entries(labels)) {
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.slot = key;
        button.append(key.toUpperCase(), document.createElement('small'));
        button.lastChild.textContent = label;
        actions.append(button);
    }
    function publish() {
        const down = new Set([...direction, ...touches.values()]);

        for (const key of down) mask |= 1 << keys.indexOf(key);

        if (settings.hidden && mask !== lastMask) callback?.(mask);
        lastMask = mask;
    }
    function centerStick() {

        const y = (event.clientY - rect.top - radius) / radius;

        const travel = radius * .60 / Math.max(1, distance);

        const left = (swapped ? actionRect : directionRect).right;
        const right = (swapped ? directionRect : actionRect).left;
        const native = Math.min(area.width, area.height * 1.5);
        const gap = right - left;
        const width = gap >= native * .9 ? Math.min(native, gap) : native;
        const middle = Math.max(width / 2, Math.min(area.width - width / 2, (left + right) / 2 - area.left));
        player.style.setProperty('--game-center', middle + 'px');

            const rect = button.getBoundingClientRect();

        actions.classList.toggle('menu', menu);
        for (const button of actions.children) {
            const key = button.dataset.slot;
            button.hidden = menu && key !== 'j' && (key !== 'k' || mode === 'pause');
            button.lastChild.textContent = menu ? (key === 'j' ? '确认' : '返回') : labels[key];
        }
        layout();
    };

    // WebKit's follow-up tap (and double-tap zoom) only on the virtual pad.
    pad.addEventListener('touchend', event => {

    window.visualViewport?.addEventListener('scroll', layout);

    new ResizeObserver(layout).observe(player);
    window.addEventListener('resize', layout);
    document.addEventListener('fullscreenchange', layout);
    window.addEventListener('blur', release);
    window.addEventListener('pagehide', release);
    document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
}
